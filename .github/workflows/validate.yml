name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/si_grid_monitor/frontend/dashboard.js
      - run: node --check custom_components/si_grid_monitor/frontend/dashboard-model.mjs
      - run: node --test frontend_tests/*.test.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@22.5.0
        with:
          category: integration
